# Servidor de producción: MariaDB, servicio de aplicación, interfaz y Caddy con HTTPS.
# Uso, desde la carpeta despliegue/ y con el archivo .env.servidor ya diligenciado:
#   docker compose -f docker-compose.servidor.yml --env-file .env.servidor up -d --build
# Guía completa en docs/DESPLIEGUE.md.
name: ica-bienestar

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--skip-name-resolve']
    # Sin puertos publicados: solo el servicio de aplicación llega a la base, por la red interna.
    volumes:
      - mariadb:/var/lib/mysql
      - ./respaldos:/respaldos
    networks: [datos]
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env.servidor
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_MIGRATIONS_RUN: 'true'
      THROTTLE_DISABLED: 'false'
      # Caddy y nginx van delante de la API.
      TRUST_PROXY_HOPS: 2
    networks: [datos, web]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../frontend
    restart: unless-stopped
    networks: [web]
    depends_on: [api]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    networks: [web]
    depends_on: [web]

networks:
  datos:
    internal: true
  web:

volumes:
  mariadb:
  caddy-datos:
  caddy-config:

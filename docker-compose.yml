# Entorno completo para desarrollo local: MariaDB + API + web, sin HTTPS.
# El servidor de producción usa despliegue/docker-compose.servidor.yml (docs/DESPLIEGUE.md).
#   docker compose up --build
#   docker compose exec api node dist/database/seed.js
# Web: http://localhost:8080   API: http://localhost:3000/api/health
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ica_bienestar
      MARIADB_USER: ica
      MARIADB_PASSWORD: ica_dev
      MARIADB_ROOT_PASSWORD: root_dev
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    ports:
      - '3306:3306'
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ica
      DB_PASSWORD: ica_dev
      DB_NAME: ica_bienestar
      DB_MIGRATIONS_RUN: 'true'
      JWT_SECRET: solo-para-desarrollo-local-cambiar-en-cada-ambiente
      CORS_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      SEED_ADMIN_EMAIL: admin@ica-bienestar.local
      SEED_ADMIN_PASSWORD: CambiarEsta.2026
      # Opcionales: se toman del entorno de quien ejecuta docker compose.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - '8080:8080'
    depends_on:
      - api

volumes:
  mariadb:

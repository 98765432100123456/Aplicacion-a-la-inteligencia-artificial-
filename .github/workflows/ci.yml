name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Mínimo privilegio: el flujo solo lee el repositorio (docs/SEGURIDAD.md).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Control de seguridad y dependencias: sin secretos, sin APIs peligrosas, cabeceras y reglas completas,
  # y ninguna vulnerabilidad alta o crítica en lo que llega a producción.
  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/control-seguridad.mjs
      - name: Secretos en todo el historial de Git
        run: |
          if git log --all -p | grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|"private_key": *"|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|sk_live_[A-Za-z0-9]{10,}' | grep -v 'control-seguridad\|ci.yml'; then
            echo "Hay secretos en el historial de Git"; exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: firebase
      - run: npm audit --omit=dev --audit-level=high
        working-directory: firebase/funciones

  # Reglas de seguridad de Firestore probadas en el emulador.
  reglas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: node ../scripts/compartido.mjs --verificar
      - run: npm ci
      - run: npm ci
        working-directory: firebase/funciones
      - run: npm run typecheck
      - run: npm run test:reglas

  interfaz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - run: npx ng build --configuration demo

  # Flujos completos en el navegador contra los emuladores de Auth, Firestore y Functions.
  extremo-a-extremo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [seguridad, reglas, interfaz]
    env:
      SEMILLA_ADMIN_CORREO: admin@ica-bienestar.local
      SEMILLA_ADMIN_CLAVE: CambiarEsta.2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: firebase
      - run: npm ci && npm run build
        working-directory: firebase/funciones
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx firebase emulators:exec --config ../firebase.json --project demo-ica --only auth,firestore,functions "npm run semilla:emulador && cd ../frontend && npx playwright test"
        working-directory: firebase

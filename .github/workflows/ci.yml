name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Mínimo privilegio: el flujo solo lee el repositorio (docs/SEGURIDAD.md).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela: una publicación a medias dejaría funciones, reglas y sitio desalineados.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Control de seguridad y dependencias: sin secretos, sin APIs peligrosas, cabeceras y reglas completas,
  # y ninguna vulnerabilidad alta o crítica en lo que llega a producción.
  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/control-seguridad.mjs
      - name: Secretos en todo el historial de Git
        run: |
          if git log --all -p | grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|"private_key": *"|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|sk_live_[A-Za-z0-9]{10,}' | grep -v 'control-seguridad\|ci.yml'; then
            echo "Hay secretos en el historial de Git"; exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: firebase
      - run: npm audit --omit=dev --audit-level=high
        working-directory: firebase/funciones

  # Reglas de seguridad de Firestore probadas en el emulador.
  reglas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node ../scripts/compartido.mjs --verificar
      - run: npm ci
      - run: npm ci
        working-directory: firebase/funciones
      - run: npm run typecheck
      - run: npm run test:reglas

  interfaz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - run: npx ng build --configuration demo

  # Flujos completos en el navegador contra los emuladores de Auth, Firestore y Functions.
  extremo-a-extremo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [seguridad, reglas, interfaz]
    env:
      SEMILLA_ADMIN_CORREO: admin@ica-bienestar.local
      SEMILLA_ADMIN_CLAVE: CambiarEsta.2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: firebase
      - run: npm ci && npm run build
        working-directory: firebase/funciones
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx firebase emulators:exec --config ../firebase.json --project demo-ica --only auth,firestore,functions "npm run semilla:emulador && cd ../frontend && npx playwright test"
        working-directory: firebase

  # Actualización en vivo: cada cambio en main que pasa todas las pruebas se publica solo en
  # https://bienestar-animal-ica.web.app. Nadie tiene que descargar el proyecto ni publicar a mano;
  # quien tenga la aplicación abierta ve el aviso "Hay una versión nueva".
  # Requiere el secreto FIREBASE_CUENTA_SERVICIO (docs/DESPLIEGUE.md, "Publicación automática").
  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [seguridad, reglas, interfaz, extremo-a-extremo]
    environment:
      name: produccion
      url: https://bienestar-animal-ica.web.app
    concurrency:
      group: publicar-produccion
      cancel-in-progress: false
    env:
      CUENTA: ${{ secrets.FIREBASE_CUENTA_SERVICIO }}
    steps:
      - name: Sin credencial no se publica
        if: env.CUENTA == ''
        run: echo "::warning::Falta el secreto FIREBASE_CUENTA_SERVICIO; las pruebas pasaron pero el sitio no se publicó (docs/DESPLIEGUE.md)."
      - uses: actions/checkout@v4
        if: env.CUENTA != ''
      - uses: actions/setup-node@v7
        if: env.CUENTA != ''
        with:
          node-version: 22
      - name: Instalar y compilar (con el control de seguridad)
        if: env.CUENTA != ''
        run: |
          (cd firebase && npm ci)
          (cd firebase/funciones && npm ci)
          (cd frontend && npm ci && npm run build)
      - name: Credencial temporal
        if: env.CUENTA != ''
        run: |
          umask 077
          printf '%s' "$CUENTA" > "$RUNNER_TEMP/cuenta.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/cuenta.json" >> "$GITHUB_ENV"
      # Orden seguro: funciones, sitio y reglas. Si un paso falla, los siguientes no corren y lo
      # publicado sigue funcionando (el sitio nuevo convive con las reglas anteriores).
      - name: Publicar Cloud Functions
        if: env.CUENTA != ''
        working-directory: firebase
        run: npx firebase deploy --config ../firebase.json --project bienestar-animal-ica --only functions --non-interactive
      - name: Publicar el sitio
        if: env.CUENTA != ''
        working-directory: firebase
        run: npx firebase deploy --config ../firebase.json --project bienestar-animal-ica --only hosting --non-interactive --message "${GITHUB_SHA::12}"
      - name: Publicar reglas e índices de Firestore
        if: env.CUENTA != ''
        working-directory: firebase
        run: npx firebase deploy --config ../firebase.json --project bienestar-animal-ica --only firestore --non-interactive
      - name: Comprobar que la versión publicada es esta
        if: env.CUENTA != ''
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://bienestar-animal-ica.web.app/version.json?t=$(date +%s)" | grep -q "${GITHUB_SHA::12}"; then echo "Publicado ${GITHUB_SHA::12}"; exit 0; fi
            sleep 10
          done
          echo "::error::El sitio no muestra la versión ${GITHUB_SHA::12}"; exit 1
      - name: Borrar la credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/cuenta.json"

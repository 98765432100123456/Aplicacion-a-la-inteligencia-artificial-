name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Reglas de seguridad de Firestore probadas en el emulador.
  reglas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node ../scripts/compartido.mjs --verificar
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:reglas

  interfaz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npx ng build --configuration production
      - run: npx ng build --configuration demo

  # Flujos completos en el navegador contra los emuladores de Auth y Firestore.
  extremo-a-extremo:
    runs-on: ubuntu-latest
    needs: [reglas, interfaz]
    env:
      SEMILLA_ADMIN_CORREO: admin@ica-bienestar.local
      SEMILLA_ADMIN_CLAVE: CambiarEsta.2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: firebase
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx firebase emulators:exec --config ../firebase.json --project demo-ica --only auth,firestore "npm run semilla:emulador && cd ../frontend && npx playwright test"
        working-directory: firebase

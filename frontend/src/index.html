<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ICA Bienestar Animal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Plataforma para evaluar el bienestar animal en fincas." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1ed" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111613" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Aplica el modo elegido antes de pintar, para que no parpadee (core/services/tema.service.ts). -->
    <script>
      try {
        var tema = localStorage.getItem('ica-tema');
        if (tema === 'claro' || tema === 'oscuro') document.documentElement.dataset.tema = tema;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

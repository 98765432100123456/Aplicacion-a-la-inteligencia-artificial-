@if (evaluation(); as e) {
  <a class="volver" [routerLink]="['/predios', e.farm.id]">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>{{ e.farm.name }}
  </a>
  @if (e.status === 'BORRADOR' && canEvaluate) {
    <app-evaluation-form [evaluation]="e" (finalized)="finalizada($event)" />
  } @else {
    <app-evaluation-result [evaluation]="e" (updated)="evaluation.set($event)" />
  }
} @else if (error()) {
  <app-error-carga [mensaje]="error()!" (reintentar)="cargar()" />
} @else {
  <app-esqueleto forma="ficha" [filas]="6" etiqueta="Cargando evaluación…" />
}

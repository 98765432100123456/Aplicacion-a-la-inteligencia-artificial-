@if (proveedores().length) {
  <div class="separador"><span>o ingrese con</span></div>
  @if (error()) {
    <p class="aviso aviso-error" role="alert">{{ error() }}</p>
  }
  <div class="proveedores">
    @for (p of proveedores(); track p) {
      <button type="button" class="btn btn-secundario" (click)="ingresar(p)" [disabled]="cargando() !== null">
        @if (cargando() === p) { <span class="spinner" aria-hidden="true"></span> } @else {
          <svg class="logo-proveedor" viewBox="0 0 24 24" aria-hidden="true">
            @switch (p) {
              @case ('google') { <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/> }
              @case ('facebook') { <path fill="#1877F2" d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/> }
              @case ('microsoft') { <path fill="#F25022" d="M3 3h8.5v8.5H3z"/><path fill="#7FBA00" d="M12.5 3H21v8.5h-8.5z"/><path fill="#00A4EF" d="M3 12.5h8.5V21H3z"/><path fill="#FFB900" d="M12.5 12.5H21V21h-8.5z"/> }
            }
          </svg>
        }
        {{ nombres[p] }}
      </button>
    }
  </div>
}
@if (config()?.registration) {
  <p class="registro">¿Es propietario de una finca? <a routerLink="/registrarse">Cree su cuenta</a> para consultar sus evaluaciones.</p>
}

<app-auth-layout>
  <h2>Ingresar</h2>
  <p class="intro">Use el correo con el que el administrador lo registró.</p>

  @if (aviso) {
    <p class="aviso aviso-advertencia" role="status">{{ aviso }}</p>
  }
  @if (error()) {
    <p class="aviso aviso-error" role="alert">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        class="control"
        type="email"
        formControlName="email"
        autocomplete="username"
        inputmode="email"
        placeholder="nombre@dominio.co"
        autocapitalize="off"
        spellcheck="false"
        [attr.aria-invalid]="conError('email') || null"
        [attr.aria-describedby]="conError('email') ? 'email-error' : null"
      />
      @if (conError('email')) {
        <span class="error" id="email-error">Escriba un correo válido, por ejemplo nombre&#64;dominio.co.</span>
      }
    </div>

    <div class="campo">
      <div class="fila">
        <label for="password">Contraseña</label>
        <a routerLink="/recuperar-contrasena">¿Olvidó su contraseña?</a>
      </div>
      <app-password-input
        inputId="password"
        formControlName="password"
        [invalid]="conError('password')"
        [describedBy]="conError('password') ? 'password-error' : null"
      />
      @if (conError('password')) {
        <span class="error" id="password-error">Escriba su contraseña.</span>
      }
    </div>

    <button class="btn btn-principal btn-bloque" type="submit" [disabled]="cargando()">
      @if (cargando()) {
        <span class="spinner" aria-hidden="true"></span> Ingresando…
      } @else {
        Ingresar
      }
    </button>
  </form>
</app-auth-layout>

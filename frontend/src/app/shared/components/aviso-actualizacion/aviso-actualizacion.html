@if (actualizacion.disponible()) {
  <section class="aviso-actualizacion" role="status" aria-labelledby="actualizacion-titulo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4" /></svg>
    <div class="texto">
      <h2 id="actualizacion-titulo">Hay una versión nueva</h2>
      <p>Actualice para usar las últimas mejoras. Lo que ya guardó se conserva.</p>
    </div>
    <button type="button" class="btn btn-principal btn-sm" (click)="actualizacion.recargar()">Actualizar</button>
  </section>
}
